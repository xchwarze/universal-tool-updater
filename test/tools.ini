; Test tools.ini for the Universal Tool Updater functional/smoke battery.
;
; This file is copied verbatim into a scratch working directory by
; run_pipeline.ps1 (test/.run/) and driven with the real UpdateManager.py -
; it is never used to touch the repository's own root tools.ini or Tools\
; folders.
;
; NOTE: configparser does not preserve comments across a write, and
; UpdateManager rewrites this file (local_version, [UpdaterConfig]) after
; almost every run. The comments below are documentation for humans
; reading the source file before the pipeline runs; they will not survive
; into test/.run/tools.ini after the first tool update.
;
; Sections are grouped:
;   1. [UpdaterConfig]                      - global defaults for the whole battery
;   2. Fixture(...)                         - deterministic, local fixture-server-backed
;   3. Portmon / malunpack / OUI / mitmproxy - REQUIRES NETWORK (real public tools)

[UpdaterConfig]
disable_clean = False
disable_repack = False
disable_install_check = True
disable_progress = True
save_format_type = full
use_github_api =
request_timeout = 20
download_retries = 2
parallel_workers = 1
download_segments = 2
global_post_update = scripts\hook_global_post_update.bat

; ---------------------------------------------------------------------
; Local fixture-server-backed entries (deterministic, no network needed)
; Server: test/fixture_server.py on http://127.0.0.1:18971
; ---------------------------------------------------------------------

; from=web smoke coverage + .bat pre_update/post_update hooks (bare paths,
; single-token command).
[FixtureWeb]
folder = tools\FixtureWeb
url = http://127.0.0.1:18971/release/basic.html
from = web
re_version = FixtureWeb version ([\d.]+)
re_download = href="(download/[^"]+\.zip)"
pre_update = scripts\hook_pre_update.bat
post_update = scripts\hook_post_update.bat

; zip-inside-zip (Packer.unpack_nested) + bare .ps1 post_unpack hook
; (regression test for launching a bare .ps1 script path).
[FixtureNested]
folder = tools\FixtureNested
url = http://127.0.0.1:18971/release/nested.html
from = web
re_version = FixtureNested version ([\d.]+)
re_download = href="(download/[^"]+\.zip)"
post_unpack = scripts\hook_post_unpack_bare.ps1

; Server returns a real zip but lies about Content-Type: text/html.
; Content-Type check is ON (default) -> the download must be rejected.
[FixtureContentTypeReject]
folder = tools\FixtureContentTypeReject
url = http://127.0.0.1:18971/release/misreport.html
from = web
re_version = FixtureMisreport version ([\d.]+)
re_download = href="(download/[^"]+\.zip)"

; Same misreporting endpoint as above, but disable_content_type_check
; lets the (actually valid) download through.
[FixtureContentTypeAllowed]
folder = tools\FixtureContentTypeAllowed
url = http://127.0.0.1:18971/release/misreport.html
from = web
re_version = FixtureMisreport version ([\d.]+)
re_download = href="(download/[^"]+\.zip)"
disable_content_type_check = true

; from=http + a deliberately tricky Content-Disposition header
; (filename= AND filename*=, plus a "../../evil.zip" path-traversal
; attempt). Regression test for Downloader.resolve_filename stripping
; directory components.
[FixtureContentDisposition]
folder = tools\FixtureContentDisposition
update_url = http://127.0.0.1:18971/download/tricky
from = http
disable_repack = true

; merge=True: an "old version" .7z is seeded directly into the folder by
; run_pipeline.ps1 (via fixtures.py seed-merge) before the very first run,
; forcing Packer.repack_merge to fire on this tool's first real update.
; post_update is wired as a MULTI-WORD command string (regression test for
; "command with arguments as one string" launching), not a bare path.
[FixtureMerge]
folder = tools\FixtureMerge
url = http://127.0.0.1:18971/release/merge.html
from = web
re_version = FixtureMerge version ([\d.]+)
re_download = href="(download/[^"]+\.zip)"
merge = True
local_version = 1.0.0
post_update = powershell -NoProfile -ExecutionPolicy Bypass -File scripts\hook_post_update_multiword.ps1

; update_file_pass against a real AES-encrypted 7z (built with py7zr,
; already a project dependency - no pyminizip needed).
[FixturePasswordProtected]
folder = tools\FixturePasswordProtected
url = http://127.0.0.1:18971/release/passwordzip.html
from = web
re_version = FixturePasswordProtected version ([\d.]+)
re_download = href="(download/[^"]+\.7z)"
update_file_pass = fixturepw

; Same payload as FixtureWeb, but disable_repack is set per-tool to prove
; the tool-level override wins even when the global default has repack
; enabled (see [UpdaterConfig] disable_repack = False above).
[FixtureRepackOverride]
folder = tools\FixtureRepackOverride
url = http://127.0.0.1:18971/release/basic.html
from = web
re_version = FixtureWeb version ([\d.]+)
re_download = href="(download/[^"]+\.zip)"
disable_repack = true

; Real RAR archive (built with a real Rar.exe if one is present on this
; machine - see fixtures.find_rar_exe()). run_pipeline.ps1 only includes
; this tool in a real run when a working Rar.exe was actually detected;
; the release page is always served so the --dry-run pass can still
; scrape it either way.
[FixtureRar]
folder = tools\FixtureRar
url = http://127.0.0.1:18971/release/rarfixture.html
from = web
re_version = FixtureRar version ([\d.]+)
re_download = href="(download/[^"]+\.rar)"

; ---------------------------------------------------------------------
; Real public tools - REQUIRES NETWORK. Copied in spirit from the repo's
; own root tools.ini. Kept small/stable/fast on purpose.
; ---------------------------------------------------------------------

; from=web, Microsoft sysinternals docs mirror on GitHub.
[Portmon]
folder = tools\Portmon
url = https://raw.githubusercontent.com/MicrosoftDocs/sysinternals/main/sysinternals/downloads/portmon.md
update_url = https://download.sysinternals.com/files/PortMon.zip
from = web
re_version = # Portmon v(\d+\.\d+)

; from=github, no re_download for the primary arch key, only the
; re_download_x64/x86 architecture overrides.
[malunpack]
folder = tools\malunpack
url = hasherezade/mal_unpack
from = github
re_download_x64 = mal_unpack64.zip
re_download_x86 = mal_unpack32.zip

; from=http, tiny stable text file. disable_content_type_check = true
; because the server serves text/plain.
[OUI]
folder = tools\OUI
update_url = https://standards-oui.ieee.org/oui/oui.txt
from = http
disable_content_type_check = true

; from=scoop. Left as a dry-run-only smoke check (real download is large).
[mitmproxy]
folder = tools\mitmproxy
url = mitmproxy
from = scoop
scoop_bucket = extras
